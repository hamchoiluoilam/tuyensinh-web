{% extends "base.html" %}

{% block title %}Đăng Nhập Thí Sinh - Cổng Tuyển Sinh 2026{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-5">
        <div class="card card-custom p-4 border-top border-primary border-4">
            <div class="text-center mb-4">
                <i class="bi bi-person-circle fs-1 text-primary"></i>
                <h3 class="fw-bold text-dark mt-2">Đăng Nhập Thí Sinh</h3>
                <p class="text-muted small">Sử dụng Email đã đăng ký để quản lý hồ sơ và thanh toán</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Địa chỉ Email (*)</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" class="form-control" required placeholder="vidu@gmail.com">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Mật khẩu (*)</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" class="form-control" required placeholder="Nhập mật khẩu">
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold" id="btnLogin">
                        <i class="bi bi-box-arrow-in-right"></i> Đăng Nhập
                    </button>
                </div>
            </form>

            <div id="loginAlert" class="mt-3 d-none"></div>

            <hr class="my-4">
            <div class="text-center">
                <span class="text-muted">Chưa có tài khoản thí sinh? </span>
                <a href="/register" class="fw-bold text-primary text-decoration-none">Đăng ký tài khoản mới &raquo;</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('btnLogin');
    const alertBox = document.getElementById('loginAlert');
    btn.disabled = true;

    const payload = {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
    };

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
            alertBox.className = "alert alert-success mt-3";
            alertBox.textContent = "Đăng nhập thành công! Đang chuyển hướng vào Cổng Thí Sinh...";
            alertBox.classList.remove('d-none');
            setTimeout(() => {
                window.location.href = '/student';
            }, 800);
        } else {
            alertBox.className = "alert alert-danger mt-3";
            alertBox.textContent = data.detail || "Email hoặc mật khẩu không chính xác!";
            alertBox.classList.remove('d-none');
        }
    } catch(err) {
        alertBox.className = "alert alert-danger mt-3";
        alertBox.textContent = "Lỗi kết nối máy chủ!";
        alertBox.classList.remove('d-none');
    } finally {
        btn.disabled = false;
    }
}
</script>
{% endblock %}
